<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="metal-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4E5" stop-opacity="0" />
      <stop offset="0.5" stop-color="#FFF4E5" stop-opacity="0.9" />
      <stop offset="1" stop-color="#FFF4E5" stop-opacity="0" />
    </linearGradient>
    <clipPath id="mark-clip">
      <rect x="2" y="2" width="28" height="28" rx="6.5" />
    </clipPath>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#242321" stroke="#8B5E3C" stroke-width="1" />
  <text
    x="16"
    y="18.5"
    fill="#D99B70"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14.5"
    font-weight="900"
    letter-spacing="-1.1"
    text-anchor="middle"
  >ПС</text>
  <text
    x="16"
    y="27"
    fill="#F0C39F"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8"
    font-weight="800"
    letter-spacing="0.4"
    text-anchor="middle"
  >14</text>
  <g clip-path="url(#mark-clip)" aria-hidden="true">
    <g transform="skewX(-20)">
      <rect x="-9" y="2" width="5" height="28" fill="url(#metal-sheen)" opacity="0">
        <animate
          attributeName="x"
          values="-9;38;38"
          keyTimes="0;0.24;1"
          dur="7s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="opacity"
          values="0;0.72;0;0"
          keyTimes="0;0.1;0.25;1"
          dur="7s"
          repeatCount="indefinite"
        />
      </rect>
    </g>
  </g>
  <style>
    @media (prefers-reduced-motion: reduce) {
      g[aria-hidden="true"] { display: none; }
    }
  </style>
</svg>
